name: Windows 0.8.96 fix test release

on:
  push:
    branches:
      - release/windows-0.8.96-fix-test
    paths:
      - '.github/workflows/windows-fix-test-release.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build Windows x64
        run: dart setup.dart windows -v

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.8.96-windows-fix-test
          path: ./dist
          if-no-files-found: error

      - name: Create test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.96-windows-fix-test
          name: FlClash 0.8.96 Windows Fix Test
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Windows x64 verification build for the loading indicator spike fix in #2327.

            App version remains 0.8.96. This release is only for validating the proposed loading animation fix.
          files: ./dist/*

# Triggered intentionally for the Windows verification build.
